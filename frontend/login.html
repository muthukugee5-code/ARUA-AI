<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – ARUA AI</title>
  <link rel="icon" href="assets/logo-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles/main.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 3;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-2xl);
      padding: 40px;
      backdrop-filter: blur(20px);
    }
    .auth-logo-center {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-icon-center {
      width: 56px;
      height: 56px;
      background: var(--gradient-primary);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: white;
      margin: 0 auto 12px;
    }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-subtle); }
    .divider-text { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="aurora-bg"></div>
  <div class="mouse-glow"></div>

  <div class="auth-page">
    <div class="auth-card glass-strong slide-up">
      <div class="auth-logo-center">
        <img src="assets/logo-icon.svg" alt="ARUA AI" style="width:56px;height:56px;margin:0 auto 12px">
        <h1 style="font-family:var(--font-heading);font-weight:800;font-size:1.5rem">Welcome back</h1>
        <p style="color:var(--text-muted);font-size:0.9rem">Sign in to continue creating</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label">Email address</label>
          <div style="position:relative">
            <i class="fas fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-hint);font-size:0.85rem"></i>
            <input type="email" id="email" class="form-input" style="padding-left:40px" placeholder="you@example.com" required autocomplete="email" autofocus>
          </div>
        </div>

        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <label class="form-label">Password</label>
            <a href="#" style="font-size:0.8rem;color:var(--accent-primary)">Forgot password?</a>
          </div>
          <div style="position:relative">
            <i class="fas fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-hint);font-size:0.85rem"></i>
            <input type="password" id="password" class="form-input" style="padding-left:40px;padding-right:44px" placeholder="Your password" required autocomplete="current-password">
            <button type="button" id="toggle-pass" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-hint);background:none;border:none;cursor:pointer">
              <i class="fas fa-eye" id="pass-icon"></i>
            </button>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px">
          <input type="checkbox" id="remember" style="accent-color:var(--accent-primary)">
          <label for="remember" style="font-size:0.85rem;color:var(--text-muted);cursor:pointer">Remember me</label>
        </div>

        <div id="login-error" class="hidden" style="padding:12px 16px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;color:#f87171;font-size:0.85rem;margin-bottom:16px;display:flex;align-items:center;gap:8px">
          <i class="fas fa-exclamation-circle"></i>
          <span id="login-error-text"></span>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary w-full btn-lg">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <div class="divider"><span class="divider-text">Don't have an account?</span></div>

      <a href="signup.html" class="btn btn-glass w-full" style="justify-content:center">
        <i class="fas fa-user-plus"></i> Create Free Account
      </a>

      <a href="index.html" class="btn btn-ghost w-full" style="justify-content:center;margin-top:8px">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
  <script src="scripts/core.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

    document.getElementById('toggle-pass').addEventListener('click', () => {
      const input = document.getElementById('password');
      const icon = document.getElementById('pass-icon');
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('login-error');
      const errorText = document.getElementById('login-error-text');
      errorEl.classList.add('hidden');
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      if (!email || !password) {
        Form.setError(document.getElementById(email ? 'password' : 'email'), 'This field is required');
        return;
      }

      const btn = document.getElementById('login-btn');
      Form.setLoading(btn, true, 'Signing in...');

      try {
        const result = await API.post('/login', { email, password });

        if (result && result.success) {
          Auth.setSession(result, remember);
          Toast.success(`Welcome back, ${result.user?.username || 'Creator'}! ✨`);
          setTimeout(() => window.location.href = 'dashboard.html', 800);
        }
      } catch (err) {
        errorText.textContent = err.message || 'Invalid email or password';
        errorEl.classList.remove('hidden');
        errorEl.style.display = 'flex';
      } finally {
        Form.setLoading(btn, false);
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    });
  </script>
</body>
</html>
